<!--
  YouTube's player controls, built faithfully from the capture in
  docs/research/youtube-player-2026-07.md (live youtube.com/watch page, player
  build `ytp-delhi-modern`, 2026-07-27).

  What is verbatim from the capture:
    * the three children of `.ytp-right-controls`, and the fact that
      `.ytp-pip-button` is a *sibling* of the two grouping divs rather than
      inside either of them;
    * the `data-priority` values that were measured: subtitles 5, pip 8,
      size 9, remote 10, fullscreen 12;
    * the PiP button's own markup — `data-priority`, `data-tooltip-title`, the
      inline `display: none` YouTube sets, and a plain 24x24 `currentColor`
      glyph identical in kind to its neighbours;
    * the `<style>` rules below, which are the CSS contract the shrunken-button
      bug was fought against, and the measured live value of
      `--yt-delhi-pill-top-height` (8px, not the 12px fallback).

  What is deliberately not verbatim, so that nothing here reads as measured when
  it was not:
    * every `<path d="...">` is truncated — path data is irrelevant to placement
      and visibility, and a full copy would be unreviewable noise;
    * the player root's real class list is longer (width-mode and state classes);
      only the two that matter to the captured CSS are kept;
    * `data-priority` is NOT invented for the buttons whose value was not
      captured (expand, autonav, settings, play). The capture says every button
      carries one; it does not say which. Their absence here doubles as coverage
      of the "sibling with no priority" path.
    * the `--yt-delhi-pill-top-height` declaration is placed on the player
      element because only its computed value was captured, not the selector
      that declares it.

  `.ytp-remote-button` (AirPlay) is present on purpose: the implementation this
  fixture replaced chose its insertion point with an AirPlay branch that no test
  ever covered (DECISIONS 31).
-->
<style>
  /* Every control button's glyph, PiP included — the reason no compensation is
     needed, and the reason writing one broke the button. */
  .ytp-delhi-modern-icons .ytp-chrome-controls .ytp-button svg {
    padding: var(--yt-delhi-pill-top-height, 12px) 12px;
  }

  .ytp-xsmall-width-mode.ytp-delhi-modern-icons
    .ytp-right-controls
    .ytp-button:not(.ytp-expand-right-bottom-section-button)
    svg {
    width: 18px;
    height: 18px;
    padding: 7px;
  }

  .ytp-big-mode.ytp-delhi-modern-icons .ytp-chrome-controls .ytp-button svg {
    vertical-align: top;
    padding: calc((var(--yt-delhi-big-mode-pill-height, 56px) - 24px) / 2);
  }

  .html5-video-player {
    --yt-delhi-pill-top-height: 8px;
  }
</style>

  <div class="ytp-chrome-bottom">

          </button>
          <button class="ytp-settings-button ytp-button" data-tooltip-title="Settings">

        <div class="ytp-right-controls-right">
